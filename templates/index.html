<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAElla— Composition de programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="{{ url_for('static', path='/css/base.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/catalogue.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/constraints.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/layout.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/panel.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/program.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/toast.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='/css/tooltip.css') }}" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo">UCLouvain &mdash;</div>
            <div>
            <select id="program-selector" onchange="programEventHandler(event)">
</select>
</div>
  <div class="ects-total">
    <strong id="hdr-ects">0</strong> / 120 ECTS sélectionnés
  </div>
</header>
<div id="ui-loading">
  <p>Loading programme...</p>
</div>

<div id="ui-error" hidden>
  <p>Could not load programme: <span id="error-message"></span></p>
  <button onclick="init()">Retry</button>
</div>

<div id="ui-ready" hidden>
  <!-- your three panels go here -->
<!-- LEFT PANEL -->
<div class="panel" id="panel-browser">
  <div class="panel-header">
    <h2>Catalogue des cours</h2>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Rechercher un cours…" autocomplete="off">
        <span class="search-clear" id="search-clear">CLEAR</span>
      </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="EN">EN</button>
      <button class="filter-btn" data-filter="FR">FR</button>
      <button class="filter-btn" data-filter="q1">Q1</button>
      <button class="filter-btn" data-filter="q2">Q2</button>
      <button class="filter-btn" data-filter="5">5 ECTS</button>
    </div>
                    <span class="results-count">Found <span id="results-count">no</span> courses</span>
  </div>
  <div id="browser-content"></div>
</div>

<!-- MIDDLE PANEL -->
<div class="panel" id="panel-program">
  <div class="panel-header">
    <h2>Mon programme</h2>
    <div class="view-switcher">
      <button class="view-btn active" data-view="list">List</button>
      <button class="view-btn" data-view="grid">Grid</button>
      <button class="view-btn" data-view="stats">Stats</button>

    </div>
  </div>
  <div id="program-content"></div>
</div>

<!-- RIGHT PANEL -->
<div class="panel" id="panel-constraints">
  <div class="panel-header">
    <h2>Contraintes &amp; Orientation</h2>
  </div>

  <div class="total-ects-display">
    <div class="total-ects-ring">
      <svg id="ring-svg" width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#1f2435" stroke-width="9"/>
        <circle id="ring-fill" cx="50" cy="50" r="42" fill="none"
          stroke="#4d7cfe" stroke-width="9"
          stroke-dasharray="263.9" stroke-dashoffset="263.9"
          stroke-linecap="round"
          transform="rotate(-90 50 50)"
          style="transition: stroke-dashoffset .4s ease, stroke .3s"/>
      </svg>
      <div class="ring-text">
        <span class="big" id="ring-num">0</span>
        <span class="small">/ 120</span>
      </div>
    </div>
  </div>

  <!-- <div class="radar-wrap"> -->
  <!--   <div class="radar-title">Orientation académique</div> -->
  <!--   <svg id="radar-svg" width="260" height="220" viewBox="0 0 260 220"></svg> -->
  <!-- </div> -->

  <div class="constraints-list" id="constraints-list"></div>
</div>

<div class="tooltip" id="course-tooltip"></div>
<div class="tooltip" id="option-tooltip"></div>
</div>
<div id="toast-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="/static/js/config.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/helpers.js"></script>
<script src="/static/js/ui/toast.js"></script>
<script src="/static/js/ui/tooltip.js"></script>
<script src="/static/js/selection.js"></script>
<script src="/static/js/ui/catalogue.js"></script>
<script src="/static/js/ui/program.js"></script>
<script src="/static/js/ui/constraints.js"></script>
<script src="/static/js/ui/radar.js"></script>
<script src="/static/js/app.js"></script>
</body>
